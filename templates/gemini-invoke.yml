name: Gemini CLI Invoke

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: 트리거된 댓글 ID
        required: true
        type: string
      comment_body:
        description: 댓글 전체 내용
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  invoke:
    runs-on: ubuntu-latest
    # 직접 이벤트 트리거인 경우 @gemini-cli 포함 여부 확인
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@gemini-cli')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for Gemini CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Extract command
        id: cmd
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BODY="${{ inputs.comment_body }}"
            COMMENT_ID="${{ inputs.comment_id }}"
          else
            BODY="${{ github.event.comment.body }}"
            COMMENT_ID="${{ github.event.comment.id }}"
          fi

          # @gemini-cli 이후 텍스트를 명령어로 추출
          CMD=$(echo "$BODY" | sed 's/.*@gemini-cli//' | xargs)
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Run Gemini command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          gemini invoke \
            --command "${{ steps.cmd.outputs.command }}" \
            --reply-to-comment "${{ steps.cmd.outputs.comment_id }}"
