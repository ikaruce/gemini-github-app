[project]
name = "gemini-github-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "PyNaCl>=1.5.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
